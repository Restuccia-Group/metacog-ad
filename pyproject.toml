[project]
name = "metacog-ad"
version = "0.1.0"
description = "A metacognitive perspective on anomaly detection with vision foundation models"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "timm>=1.0.20",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "tifffile>=2024.1",
    "Pillow>=10.0",
    "tqdm>=4.66",
]

# Installed by `uv sync`, not by `pip install -e .`. Only the tests need it.
[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
metacog-run = "metacog.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Two packages: `industrial` is SuperADD's code, `metacog` is ours. Only `industrial/model.py`
# imports from `metacog`; docs/UPSTREAM_DIFF.md lists every change to it.
[tool.hatch.build.targets.wheel]
packages = ["tracks/industrial/src/industrial", "src/metacog"]
